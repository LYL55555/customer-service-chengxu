<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#637a68"/></marker></defs><rect width="1000" height="680" fill="#f8f6f1"/><style>text{font-family:system-ui,"PingFang SC",sans-serif;fill:#24352e}</style><text x="30" y="42" font-size="25" font-weight="600">澄序 0.16.3 · 实际本地实现</text><text x="30" y="66" font-size="14">原型范围：本机、草拟、不自动执行外部动作；结构约束与复核都可能失败</text><rect x="30" y="90" width="280" height="115" rx="10" fill="white" stroke="#a7b4a4"/><text x="45" y="120" font-size="17" font-weight="600">顾问工作台 · 原生网页</text><text x="45" y="148" font-size="14" font-weight="400">截图 / 已存客户记录 / 一句话背景</text><text x="45" y="176" font-size="14" font-weight="400">场景与当前任务；不要求完整档案</text><rect x="360" y="90" width="280" height="115" rx="10" fill="white" stroke="#a7b4a4"/><text x="375" y="120" font-size="17" font-weight="600">截图理解 · 本机OCR＋布局</text><text x="375" y="148" font-size="14" font-weight="400">可改角色、文字、顺序和漏句</text><text x="375" y="176" font-size="14" font-weight="400">确认导入；语音未知不补写</text><rect x="690" y="90" width="280" height="115" rx="10" fill="white" stroke="#a7b4a4"/><text x="705" y="120" font-size="17" font-weight="600">当前上下文与独立来源</text><text x="705" y="148" font-size="14" font-weight="400">确认聊天 / 顾问要求 / 当前UID资料</text><text x="705" y="176" font-size="14" font-weight="400">商品已知未知 / 政策 / 订单 / 活动</text><rect x="30" y="280" width="280" height="120" rx="10" fill="white" stroke="#a7b4a4"/><text x="45" y="310" font-size="17" font-weight="600">共用生成 engine.generate</text><text x="45" y="338" font-size="14" font-weight="400">DeepSeek beta 工具约束</text><text x="45" y="366" font-size="14" font-weight="400">ready恰好三条 / 顾问缺口零条</text><rect x="360" y="280" width="280" height="120" rx="10" fill="white" stroke="#a7b4a4"/><text x="375" y="310" font-size="17" font-weight="600">本地检查 → 模型另次复核</text><text x="375" y="338" font-size="14" font-weight="400">对象 / 数字 / 政策 / 联系限制</text><text x="375" y="366" font-size="14" font-weight="400">完整候选；逐句编辑与引用</text><rect x="690" y="280" width="280" height="120" rx="10" fill="white" stroke="#a7b4a4"/><text x="705" y="310" font-size="17" font-weight="600">复核校验与交付守门</text><text x="705" y="338" font-size="14" font-weight="400">结构 / 来源权限 / 明显矛盾</text><text x="705" y="366" font-size="14" font-weight="400">选一条复制；不自动发微信</text><rect x="30" y="480" width="610" height="120" rx="10" fill="white" stroke="#a7b4a4"/><text x="45" y="510" font-size="17" font-weight="600">SQLite：顾问 → 客户 → 会话 → 检查点</text><text x="45" y="538" font-size="14" font-weight="400">长期偏好与拒收营销归客户；预算和临时需求归会话</text><text x="45" y="566" font-size="14" font-weight="400">文件：截图、识别/人工修订、原响应、复核、版本和用量</text><rect x="690" y="480" width="280" height="120" rx="10" fill="white" stroke="#a7b4a4"/><text x="705" y="510" font-size="17" font-weight="600">实验与网页共用逻辑</text><text x="705" y="538" font-size="14" font-weight="400">原50冻结 / 失败保留</text><text x="705" y="566" font-size="14" font-weight="400">后续修订分支，不混合通过率</text><path d="M310 148L355 148" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M640 148L685 148" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M830 205L830 240" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M830 240L170 240" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M170 240L170 275" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M310 340L355 340" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M640 340L685 340" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M170 400L170 475" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M500 400L500 475" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M830 400L830 475" stroke="#637a68" fill="none" stroke-width="2" marker-end="url(#a)"/><text x="30" y="638" font-size="14">资料不足按任务依赖处理；客户原话不授权品牌事实。窄兼容只恢复固定标记，不补判定或事实。</text><text x="30" y="660" font-size="14">未实现生产登录/云同步；视觉模型为可配置补充，当前验收主要使用本机OCR和文字模型。</text></svg>