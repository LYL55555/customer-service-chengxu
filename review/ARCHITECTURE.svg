<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="690" viewBox="0 0 1010 690"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#607b68"/></marker></defs><rect width="1010" height="690" fill="#f8f7f0"/><style>text{font-family:system-ui,"PingFang SC",sans-serif;fill:#26382f}</style><text x="25" y="39" font-size="25" font-weight="600">澄序 0.21.1 · 当前实际实现</text><text x="25" y="65" font-size="14">生成只取相关素材；完整资料留给校验。结构约束和模型复核仍可能出错。</text><rect x="25" y="90" width="295" height="120" rx="10" fill="white" stroke="#a8b5a5"/><text x="39" y="120" font-size="16" font-weight="600">顾问网页 · UI2.0.0</text><text x="39" y="149" font-size="13" font-weight="400">六场景 / 截图或文字 / 一句背景</text><text x="39" y="178" font-size="13" font-weight="400">已存客户记录，称呼即可开始</text><rect x="355" y="90" width="295" height="120" rx="10" fill="white" stroke="#a8b5a5"/><text x="369" y="120" font-size="16" font-weight="600">上下文与任务理解</text><text x="369" y="149" font-size="13" font-weight="400">本机OCR → 角色/顺序/漏句复核</text><text x="369" y="178" font-size="13" font-weight="400">当前需求、前文、引用与联系限制</text><rect x="685" y="90" width="300" height="120" rx="10" fill="white" stroke="#a8b5a5"/><text x="699" y="120" font-size="16" font-weight="600">按本次任务取材 2.5.0</text><text x="699" y="149" font-size="13" font-weight="400">只给相关对客事实与必要动作</text><text x="699" y="178" font-size="13" font-weight="400">来源、计算与排除项留档</text><rect x="685" y="290" width="300" height="130" rx="10" fill="white" stroke="#a8b5a5"/><text x="699" y="320" font-size="16" font-weight="600">生成 · engine.generate</text><text x="699" y="349" font-size="13" font-weight="400">DeepSeek Flash / 提示2.3.0</text><text x="699" y="378" font-size="13" font-weight="400">有效三条；顾问缺原文零条</text><rect x="355" y="290" width="295" height="130" rx="10" fill="white" stroke="#a8b5a5"/><text x="369" y="320" font-size="16" font-weight="600">原程序检查＋一次模型复核</text><text x="369" y="349" font-size="13" font-weight="400">完整品牌/已知未知/全部来源</text><text x="369" y="378" font-size="13" font-weight="400">复核Flash / 提示1.6.0</text><rect x="25" y="290" width="295" height="130" rx="10" fill="white" stroke="#a8b5a5"/><text x="39" y="320" font-size="16" font-weight="600">复核依据与交付校验</text><text x="39" y="349" font-size="13" font-weight="400">结构、来源权限、对象与数字</text><text x="39" y="378" font-size="13" font-weight="400">三条原文 → 顾问选一条复制</text><rect x="25" y="495" width="625" height="115" rx="10" fill="white" stroke="#a8b5a5"/><text x="39" y="525" font-size="16" font-weight="600">SQLite＋本机文件 · 明确UID归属</text><text x="39" y="554" font-size="13" font-weight="400">顾问 → 客户 → 会话 → 检查点；长期偏好与本次需求分开</text><text x="39" y="583" font-size="13" font-weight="400">原图、识别/人工修订、原响应、引用、版本与用量分别保留</text><rect x="685" y="495" width="300" height="115" rx="10" fill="white" stroke="#a8b5a5"/><text x="699" y="525" font-size="16" font-weight="600">网页与实验共用逻辑</text><text x="699" y="554" font-size="13" font-weight="400">旧50/150与定向分支分列</text><text x="699" y="583" font-size="13" font-weight="400">无静默改写、无自动重试</text><path d="M320 150L350 150" stroke="#607b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M650 150L680 150" stroke="#607b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M835 210L835 285" stroke="#607b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M685 355L655 355" stroke="#607b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M355 355L325 355" stroke="#607b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M170 420L170 490" stroke="#607b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M500 420L500 490" stroke="#607b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M835 420L835 490" stroke="#607b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="25" y="645" font-size="14">已知重量可计算部分小计；未知项不是客户消息素材。无真实库存、订单、自动发送微信或生产认证。</text><text x="25" y="670" font-size="14">Pro仅为两案开发对照，未接入；N16已认可结束。没有真人愿发率、节时或优于